[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kohler-unified-enterprise-ai-agent"
version = "0.1.0"
description = "A secure, domain-partitioned enterprise knowledge agent."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "openpyxl>=3.1,<4.0",
  "jsonschema>=4.23,<5.0",
  "itsdangerous>=2.2,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "pypdf>=5.0.0,<6.0",
  "python-docx>=1.1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
